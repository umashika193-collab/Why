name: "Auto Update SEC EDGAR Primary Intelligence"

on:
  # 平日の日本時間 毎朝 07:00 (UTC 22:00) に自動実行
  schedule:
    - cron: '0 22 * * 1-5'
  
  # GitHubのUIから手動でいつでも実行可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sec-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEC EDGAR Filing Monitor & Verifier
        run: |
          python scripts/auto_updater.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/latest_sec_status.json
          if git diff --staged --quiet; then
            echo "No new filings detected today. Skip commit."
          else
            git commit -m "chore(data): auto-update SEC EDGAR verified filings [skip ci]"
            git push
          fi
