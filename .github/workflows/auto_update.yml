name: "Auto Update SEC EDGAR Primary Intelligence & Feed"

on:
  # 平日の日本時間 毎朝 07:00 (UTC 22:00) に自動実行
  schedule:
    - cron: '0 22 * * 1-5'
  
  # GitHubのUIから手動でいつでもワンクリック実行可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-synthesize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Run SEC EDGAR Monitor
        run: |
          python scripts/auto_updater.py

      - name: 2. Run AI Intelligence Synthesizer (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/feed_auto_generator.py

      - name: 3. Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/latest_sec_status.json src/data/mockData.ts
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "chore(feed): auto-update SEC intelligence feed with Gemini [skip ci]"
            git push
          fi
